apiVersion: v1
kind: PersistentVolume
metadata:
  name: generic-pv-v2
  namespace: frontend
  labels:
    pv : frontend-v2
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: "/files"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: generic-pvc-v2
  namespace: frontend
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
